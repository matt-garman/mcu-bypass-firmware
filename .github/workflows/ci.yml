name: CI

# Continuous integration for the MCU bypass firmware.
#
# The goal of this workflow is reproducibility: it proves that the full
# build + verification suite passes on a clean machine, not just on the
# developer's box. The runner is pinned to ubuntu-24.04 so the installed
# toolchain matches TOOLCHAIN.adoc (avr-gcc 7.3, gcc 13, clang/clang-tidy 18,
# cppcheck 2.13, simavr 1.6) as closely as the distro packages allow.
#
# Most of the matrix lives inside the Makefile: a single `make test` already
# exercises all three variants (cd4053_simple, cd4053_with_mute,
# tq2_l2_5v_relay) across the ATtiny13a and
# the tinyx5 family, plus every analysis gate (clang-tidy, cppcheck,
# clang-analyzer, MISRA-C:2012), the PIC10F320 host lanes (firmware<->core
# equivalence, actuation, host fault injection and firmware line coverage, all
# three variants -- host compiler only, no XC8), and the coverage gates. The jobs
# below wrap that, surface the per-MCU build matrix as discrete checks, and run
# the slower exhaustive/mutation suite off the PR hot path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly exhaustive run (Mondays 06:00 UTC) so the long suite is exercised
    # even when there are no pushes.
    - cron: '0 6 * * 1'

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # -------------------------------------------------------------------------
  # Gating job: the full fast suite. This is the "build passing" badge.
  # `make test` = analyze (clang-tidy + cppcheck + clang-analyzer + MISRA)
  #             + host/model-check/symbolic/fuse tests
  #             + CBMC SAT/SMT proof of the real bypass_pure.c core
  #             + PIC10F320 host lanes, all three variants (equivalence against
  #               that same core, actuation, host fault, firmware line coverage)
  #             + simavr functional + fault-injection across all variants,
  #               ATtiny13a and tinyx5
  #             + golden-model and verified-core coverage gates.
  # -------------------------------------------------------------------------
  verify:
    name: verify (make test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Gate the AVR suite behind the fast PIC job: a PIC failure short-circuits
    # the run -- the slow AVR jobs are skipped instead of running in parallel.
    needs: pic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make util-linux git gnupg python3 python3-yaml \
            gcc-avr avr-libc \
            simavr libsimavr-dev libelf-dev \
            clang clang-tidy cppcheck cbmc
          command -v git >/dev/null || { echo "::error::git missing"; exit 1; }
          command -v gpg >/dev/null || { echo "::error::gpg missing"; exit 1; }
          python3 -c 'import yaml' \
            || { echo "::error::PyYAML missing"; exit 1; }

      - name: Record toolchain versions
        run: |
          echo "== avr-gcc =="     && avr-gcc --version | head -1
          echo "== gcc =="         && gcc --version | head -1
          echo "== clang =="       && clang --version | head -1
          echo "== clang-tidy ==" && clang-tidy --version | head -2 | tail -1
          echo "== cppcheck =="    && cppcheck --version
          echo "== cbmc =="        && cbmc --version
          echo "== simavr =="      && (simavr --version 2>&1 | head -1 || true)
          echo "== python3 =="     && python3 --version

      - name: Full verification suite
        # STRICT_TOOLS=1: this runner installs the whole toolchain, so any
        # optional gate that would otherwise skip cleanly (cppcheck, cbmc, the
        # MISRA python addon, ...) must actually RUN -- a silent skip here would
        # mean a broken install masquerading as a green build.
        run: make test STRICT_TOOLS=1

  # -------------------------------------------------------------------------
  # PIC gate (BOTH chips): the PIC counterpart of `verify`.
  #
  # PIC10F322 -- `make pic10f322-test`: builds every variant with XC8 + enforces the
  # 512-word flash budget, verifies the emitted CONFIG word vs design intent,
  # runs cppcheck+MISRA on the PIC shell, and drives the footswitch through gpsim
  # asserting PORTA/LATA -- then the fail-closed real-HEX target aggregate
  # (`make pic10f322-test-target-variants`): libgpsim fault recovery, firmware/model
  # ctx_ lock-step, and GPIO transition / pulse timing for every PIC variant.
  #
  # PIC10F320 -- `make pic10f320-test` + `make pic10f320-test-target-variants`: the same
  # shape for the constrained 256-word part, plus the host lanes it alone has
  # (firmware<->core equivalence, actuation sequence, host fault injection, and
  # the exact-line firmware coverage gate). See docs/pic10f320_special_case.md
  # for why that chip's firmware inlines the verified core rather than calling it.
  #
  # ONE job for both chips, deliberately (merge plan §11, decision D3). `verify`,
  # `attiny202`, `build-matrix` and `stress` ALL declare `needs: pic`, so this job
  # gates the whole repository -- and folding PIC10F320 into it means those four
  # gate on the new chip for free, with one XC8 install and one cache restore.
  # The accepted cost is that the full PIC10F320 lane sits on their critical path.
  # Splitting it into a sibling `pic10f320` job later is mechanical, but it would
  # force an explicit decision about whether those four should gate on it; that
  # is the trade to revisit only if CI wall-clock becomes binding.
  #
  # XC8 and the PIC10-12Fxxx DFP are not in apt; they are fetched from Microchip
  # (the free tier needs no key to compile) and installed to the paths the
  # Makefile defaults to (also passed explicitly via PIC_CC / PIC_DFP and
  # PIC10F320_CC / PIC10F320_DFP -- one shared installation, two variable pairs, so
  # either chip can be re-pinned without silently moving the other). gpsim,
  # gpsim-dev + libglib2.0-dev + g++ (the libgpsim fault-inject build), cppcheck,
  # python3 come from apt.
  #
  # CRITICAL: optional simulator/analyzer sub-targets SKIP CLEANLY when a
  # tool/header is absent -- fatal for a gate even though pic10f320-test's hash and
  # return-stack prerequisites fail closed. The "Assert PIC toolchain present"
  # step fails loud so a broken install can never masquerade as a pass;
  # the cache is only SAVED after that assert, so a half-baked install is never
  # cached. Both device headers are asserted: the DFP ships both parts, but a
  # truncated unzip could leave one behind.
  #
  # NOTE: confirm the XC8 download URL and the unattended-installer flags
  # against microchip.com / `./xc8.run --help` (both change per release). The
  # DFP packs.download.microchip.com/<pack>.atpack URL scheme is stable.
  pic:
    name: pic (10F322 + 10F320)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Pin to the versions in TOOLCHAIN.adoc; bump compiler + DFP together.
      XC8_VERSION: "3.10"
      DFP_VERSION: "1.9.189"
      XC8_DIR: /opt/microchip/xc8/v3.10
      # .atpack unzips here so PIC_DFP = $XC8_DFP_ROOT/xc8 (its xc8/ subtree).
      XC8_DFP_ROOT: /opt/microchip/mdfp/PIC10-12Fxxx_DFP/1.9.189
      # The mutation gate below is the ONE fail-closed mutation run, so it needs
      # every substrate's toolchain -- including the ATtiny202 lane's. Keep this
      # in step with the attiny202 job's pinned value (both key the same cache).
      ATTINY_DFP_VER: "3.1.260"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install gpsim + analyzers (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y make util-linux gcc g++ gpsim gpsim-dev libglib2.0-dev \
            pkg-config cppcheck python3 unzip wget

      - name: Restore cached XC8 + DFP
        id: cache-xc8
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/microchip
          key: microchip-xc8-${{ env.XC8_VERSION }}-dfp-${{ env.DFP_VERSION }}-${{ hashFiles('scripts/install_pic_toolchain.sh') }}

      - name: Install XC8 (free tier) + PIC10-12Fxxx DFP
        if: steps.cache-xc8.outputs.cache-hit != 'true'
        run: scripts/install_pic_toolchain.sh

      - name: Assert PIC toolchain present (fail loud, do NOT skip)
        run: |
          xc8="${XC8_DIR}/bin/xc8-cc"
          test -x "${xc8}" || { echo "::error::XC8 missing: ${xc8}"; exit 1; }
          # One DFP, two devices. Assert BOTH headers: a truncated unzip that
          # left one behind would make that chip's whole lane skip silently.
          for d in pic10f322 pic10f320; do
            dev="${XC8_DFP_ROOT}/xc8/pic/include/proc/${d}.h"
            test -f "${dev}" || { echo "::error::DFP missing: ${dev}"; exit 1; }
          done
          for t in gpsim cppcheck c++; do
            command -v "$t" >/dev/null || { echo "::error::no $t"; exit 1; }
          done
          # the libgpsim target aggregate needs the gpsim headers + glib
          test -f /usr/include/gpsim/sim_context.h \
            || { echo "::error::gpsim-dev headers missing"; exit 1; }
          pkg-config --exists glib-2.0 \
            || { echo "::error::libglib2.0-dev missing"; exit 1; }

      # Save only after the assert passed, so a partial install is never cached.
      - name: Save XC8 + DFP cache
        if: steps.cache-xc8.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/microchip
          key: microchip-xc8-${{ env.XC8_VERSION }}-dfp-${{ env.DFP_VERSION }}-${{ hashFiles('scripts/install_pic_toolchain.sh') }}

      - name: Record toolchain versions
        run: |
          echo "xc8-cc:" && "${XC8_DIR}/bin/xc8-cc" --version | head -2 || true
          echo "gpsim:"  && (gpsim --version 2>&1 | head -1 || true)
          echo "cppcheck:" && cppcheck --version

      - name: PIC pre-hardware gate
        # STRICT_TOOLS=1: the assert step above proved XC8/DFP/gpsim are present,
        # so the pic10f322-test sub-gates must run, not skip. (Consistent with that assert.)
        run: |
          make pic10f322-test STRICT_TOOLS=1 \
            PIC_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC_DFP="${XC8_DFP_ROOT}/xc8"

      # Fail-closed target aggregate (libgpsim), every variant. The aggregate
      # itself requires explicit PASS sentinels from fault, lock-step, and I/O;
      # a silent skip or partial run is therefore a failure.
      - name: PIC target aggregate (make pic10f322-test-target-variants)
        run: |
          make pic10f322-test-target-variants STRICT_TOOLS=1 \
            PIC_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC_DFP="${XC8_DFP_ROOT}/xc8"

      # PIC10F320 pre-hardware gate. Covers every validation layer the child
      # project had: host equivalence against src/bypass_pure.c, per-variant
      # actuation sequence, host fault injection, the exact-line firmware
      # coverage gate, build + 256-word budget, reviewed image hashes, CONFIG and
      # final-HEX return-stack checks, cppcheck + MISRA, and the CLI-gpsim
      # register-level test -- the last two swept across all three variants,
      # because each compiles a different output stage.
      - name: PIC10F320 pre-hardware gate (make pic10f320-test)
        run: |
          make pic10f320-test STRICT_TOOLS=1 \
            PIC10F320_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC10F320_DFP="${XC8_DFP_ROOT}/xc8"

      # ...and the PIC10F320 fail-closed target aggregate, same contract as the
      # 322's above: explicit PASS sentinels from fault, lock-step and I/O, so a
      # silent skip or a partial matrix is a failure.
      - name: PIC10F320 target aggregate (make pic10f320-test-target-variants)
        run: |
          make pic10f320-test-target-variants STRICT_TOOLS=1 \
            PIC10F320_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC10F320_DFP="${XC8_DFP_ROOT}/xc8"

      # The mutation driver also runs its core AVR and ATtiny202 mutants. Keep
      # their extra toolchain and the minutes-long gate off the pull-request hot
      # path. binutils-avr supplies avr-nm/avr-objdump, which the ATtiny202
      # harness needs to resolve ctx_ and to read coil-pulse widths back out of
      # the built image; python3-venv/python3-dev/g++ compile yasimavr.
      - name: Install AVR mutation dependencies (apt)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y \
            gcc-avr avr-libc binutils-avr simavr libsimavr-dev libelf-dev \
            python3-venv python3-dev curl patch

      # The ATtiny202 mutation lane needs the same two out-of-apt inputs the
      # attiny202 job fetches, and for the same fail-closed reason: every
      # attiny202-* target exits 0 when one is missing, so without them the whole
      # lane reports as skipped -- which MUTATION_ALLOW_SKIP=0 then (correctly)
      # fails on. Both are version-pinned, cached, and shared with that job's
      # cache keys, so this costs a restore rather than a rebuild in the common
      # case.
      - name: Restore cached ATtiny_DFP (mutation lane)
        id: cache-dfp-mut
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/attiny_dfp
          key: attiny-dfp-${{ env.ATTINY_DFP_VER }}-${{ hashFiles('scripts/fetch_attiny_dfp.sh') }}

      - name: Restore cached patched yasimavr venv (mutation lane)
        id: cache-yasimavr-mut
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/yasimavr/venv
          key: yasimavr-venv-${{ hashFiles('scripts/fetch_yasimavr.sh', 'scripts/yasimavr-build-requirements.txt', 'third_party/yasimavr/patches/**') }}

      - name: Fetch ATtiny202 mutation-lane inputs
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          scripts/fetch_attiny_dfp.sh
          scripts/fetch_yasimavr.sh

      - name: Assert ATtiny202 mutation inputs present (fail loud, do NOT skip)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          test -f third_party/attiny_dfp/gcc/dev/attiny202/device-specs/specs-attiny202 \
            || { echo "::error::ATtiny202 device specs missing; its mutation lane would skip"; exit 1; }
          py=third_party/yasimavr/venv/bin/python
          test -x "$py" || { echo "::error::yasimavr venv missing ($py)"; exit 1; }
          "$py" -c "import yasimavr" \
            || { echo "::error::yasimavr import broken; the ATtiny202 mutation lane would skip"; exit 1; }

      - name: Save ATtiny_DFP cache (mutation lane)
        if: steps.cache-dfp-mut.outcome == 'success' && steps.cache-dfp-mut.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/attiny_dfp
          key: attiny-dfp-${{ env.ATTINY_DFP_VER }}-${{ hashFiles('scripts/fetch_attiny_dfp.sh') }}

      - name: Save yasimavr venv cache (mutation lane)
        if: steps.cache-yasimavr-mut.outcome == 'success' && steps.cache-yasimavr-mut.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/yasimavr/venv
          key: yasimavr-venv-${{ hashFiles('scripts/fetch_yasimavr.sh', 'scripts/yasimavr-build-requirements.txt', 'third_party/yasimavr/patches/**') }}

      # MUTATION_ALLOW_SKIP=0 covers EVERY substrate's mutants: the driver's
      # PIC10F320 and ATtiny202 subsets each sit behind their own tool probe, so
      # without fail-closed mode a missing toolchain would report those mutants
      # "skipped" and still exit green. This job asserted all of them above, so
      # nothing may skip.
      - name: Fail-closed mutation gate (make test-mutation)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          make test-mutation STRICT_TOOLS=1 MUTATION_ALLOW_SKIP=0 \
            PIC_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC_DFP="${XC8_DFP_ROOT}/xc8" \
            PIC10F320_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC10F320_DFP="${XC8_DFP_ROOT}/xc8"

      # Two chips, two separately named artifacts -- never one merged upload.
      # The release machinery keys on image basename. Those basenames now carry
      # the MCU (`bypass-pic10f322-<stage>.hex` vs `bypass-pic10f320-<stage>.hex`),
      # so a flattened upload would no longer silently collide -- but keep them
      # separate anyway: the directory split is the check that does not depend on
      # anyone having got the naming right.
      - name: Upload PIC10F322 firmware images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-pic10f322
          path: build_pic10f322/*.hex
          if-no-files-found: error

      - name: Upload PIC10F320 firmware images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-pic10f320
          path: build_pic10f320/*.hex
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # ATtiny202 (AVR-XT) gate: the AVR-XT counterpart of the `pic` job. It is the
  # ONLY place the ATtiny202 is built in CI (build-matrix covers the classic
  # parts), so it runs the 202 fuse, smoke/build-budget, cppcheck, and MISRA
  # gates before the yasimavr harness -- functional + physical output timing
  # (attiny202-sim), fault injection (attiny202-fault), and a short soak smoke
  # (attiny202-soak). Like every CI lane, this is a gate on the branch, NOT
  # release qualification: the 24-hour soaks and the fail-closed target
  # aggregate belong to scripts/make-release.sh.
  #
  # Two out-of-apt inputs, both fetched + version-pinned by repo scripts and
  # cached: the ATtiny_DFP device files (scripts/fetch_attiny_dfp.sh -- a static
  # atpack, no account/EULA) needed to COMPILE the image, and a PATCHED yasimavr
  # (scripts/fetch_yasimavr.sh -- pinned sdist + the two vendored bug-fix patches,
  # compiled into a project-local venv) needed to RUN it. The rest (avr-gcc,
  # cppcheck, python3-dev, g++) is apt.
  #
  # CRITICAL (same hazard as the pic job): the attiny202-* targets SKIP CLEANLY
  # when the DFP or the venv is absent -- fatal for a gate. Explicit "Assert ...
  # present" steps fail loud so a broken fetch can never make the gates go green
  # on nothing, and each run step greps for the expected number of PASS lines as
  # belt-and-suspenders against a partial (per-variant) skip.
  attiny202:
    name: "attiny202 (AVR-XT: analyze/sim/fault/soak)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: pic   # gate behind the fast PIC job (see `verify`)
    env:
      # Bump with scripts/fetch_attiny_dfp.sh's pinned VER (keeps the cache key
      # in step). The venv cache keys on the patch set + fetch script instead.
      ATTINY_DFP_VER: "3.1.260"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install toolchain (apt)
        run: |
          sudo apt-get update
          # avr-gcc/avr-libc + binutils-avr (avr-nm, used by the fault harness to
          # resolve ctx_) build+inspect the image; python3-dev + g++ compile
          # yasimavr's C++/SIP extension; python3-venv provides ensurepip;
          # libelf-dev supplies libelf.h, which yasimavr's sim_firmware.cpp
          # needs to load the ELF image.
          sudo apt-get install -y \
            make util-linux gcc-avr avr-libc binutils-avr \
            cppcheck python3 python3-venv python3-dev g++ \
            libelf-dev \
            curl unzip patch

      - name: Restore cached ATtiny_DFP
        id: cache-dfp
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/attiny_dfp
          key: attiny-dfp-${{ env.ATTINY_DFP_VER }}-${{ hashFiles('scripts/fetch_attiny_dfp.sh') }}

      - name: Fetch ATtiny_DFP device files
        run: scripts/fetch_attiny_dfp.sh

      - name: Assert ATtiny202 build + analysis inputs present
        run: |
          command -v cppcheck >/dev/null || { echo "::error::cppcheck missing"; exit 1; }
          test -f third_party/attiny_dfp/gcc/dev/attiny202/device-specs/specs-attiny202 \
            || { echo "::error::ATtiny202 device specs missing"; exit 1; }
          test -f third_party/attiny_dfp/include/avr/iotn202.h \
            || { echo "::error::ATtiny202 DFP header missing"; exit 1; }
          test -f test/misra.json && test -f test/misra_rules.txt \
            && test -f test/misra_suppressions.txt \
            || { echo "::error::MISRA analysis inputs missing"; exit 1; }

      - name: ATtiny202 pre-hardware gate (make attiny202-test)
        run: make attiny202-test STRICT_TOOLS=1

      - name: Assert ATtiny202 images built (fail loud, do NOT skip)
        run: |
          # Ask the Makefile for the canonical basenames rather than composing
          # them here. The output-stage field is exactly the variant name, but a
          # second copy of the prefix/MCU/stage composition could drift after a
          # future naming change.
          for hex in $(make -s print-XT_RELEASE_IMAGES); do
            test -f "build_avr_xt/$hex" \
              || { echo "::error::missing build_avr_xt/$hex (DFP fetch or build failed)"; exit 1; }
          done

      - name: Save ATtiny_DFP cache
        if: steps.cache-dfp.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/attiny_dfp
          key: attiny-dfp-${{ env.ATTINY_DFP_VER }}-${{ hashFiles('scripts/fetch_attiny_dfp.sh') }}

      - name: Restore cached patched yasimavr venv
        id: cache-yasimavr
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/yasimavr/venv
          # Rebuild when the pinned release, the patches, or the build script
          # change. fetch_yasimavr.sh re-verifies the venv on a hit and rebuilds
          # it if the interpreter/import is broken, so a stale cache self-heals.
          key: yasimavr-venv-${{ hashFiles('scripts/fetch_yasimavr.sh', 'scripts/yasimavr-build-requirements.txt', 'third_party/yasimavr/patches/**') }}

      - name: Build patched yasimavr (pinned sdist + vendored patches)
        run: scripts/fetch_yasimavr.sh

      - name: Assert patched yasimavr present (fail loud, do NOT skip)
        run: |
          py=third_party/yasimavr/venv/bin/python
          test -x "$py" || { echo "::error::yasimavr venv missing ($py)"; exit 1; }
          "$py" - <<'PY' || { echo "::error::yasimavr import / WDT model broken"; exit 1; }
          from yasimavr.device_library import load_device
          assert load_device('attiny202').find_peripheral('WDT') is not None
          PY

      - name: Save yasimavr venv cache
        if: steps.cache-yasimavr.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/yasimavr/venv
          key: yasimavr-venv-${{ hashFiles('scripts/fetch_yasimavr.sh', 'scripts/yasimavr-build-requirements.txt', 'third_party/yasimavr/patches/**') }}

      - name: Record versions
        run: |
          echo "== avr-gcc ==" && avr-gcc --version | head -1
          echo "== cppcheck ==" && cppcheck --version
          echo "== python3 ==" && python3 --version
          echo "== yasimavr ==" && third_party/yasimavr/venv/bin/python -c \
            "import yasimavr; print(getattr(yasimavr,'__version__','(patched 0.1.6)'))"

      # Each gate greps for one PASS line per variant, so a per-variant skip
      # (e.g. a missing image) fails the step even though make returned 0.
      #
      # The expected count comes from XT_VARIANTS_SUPPORTED, not VARIANTS.
      # VARIANTS is the classic-AVR list and is user-overridable, so a
      # `VARIANTS=cd4053_simple` invocation would shrink both the build and the
      # expectation together and let these gates go green having exercised a
      # third of the matrix. XT_VARIANTS_SUPPORTED is declared `override` and
      # cannot be shrunk that way. The fault gate below deliberately keeps a
      # hardcoded n=3 as an independent cross-check on this variable.
      - name: Functional + target-output gate (make attiny202-sim)
        run: |
          set -o pipefail
          n=$(make -s print-XT_VARIANTS_SUPPORTED | wc -w)
          make attiny202-sim 2>&1 | tee sim.log
          p=$(grep -c "SIM PASS" sim.log || true)
          [ "$p" -eq "$n" ] || { echo "::error::attiny202-sim: $p/$n variants PASSed (skip or fail)"; exit 1; }

      - name: Fault-injection gate (make attiny202-fault)
        run: |
          set -o pipefail
          # Pin the complete development matrix independently of Make defaults;
          # each FAULT PASS also requires 22/22 injections, 23/23 results, no skips.
          n=3
          make attiny202-fault 2>&1 | tee fault.log
          p=$(grep -c "FAULT PASS" fault.log || true)
          [ "$p" -eq "$n" ] || { echo "::error::attiny202-fault: $p/$n variants PASSed (skip or fail)"; exit 1; }

      # Internal-state gate: `ctx_` in simulated SRAM must equal the shipping
      # pure core's state after every settled tick. The AVR-XT counterpart of
      # the classic lock-step co-sim and pic10f322-test-lockstep. One PASS per variant,
      # and -- because each variant co-simulates BOTH boot scenarios -- two
      # co-simulation summaries per variant, so a scenario that bailed out early
      # cannot hide behind a green verdict.
      - name: Lock-step gate (make attiny202-lockstep)
        run: |
          set -o pipefail
          n=$(make -s print-XT_VARIANTS_SUPPORTED | wc -w)
          make attiny202-lockstep 2>&1 | tee lockstep.log
          p=$(grep -c "LOCKSTEP PASS" lockstep.log || true)
          [ "$p" -eq "$n" ] || { echo "::error::attiny202-lockstep: $p/$n variants PASSed (skip or fail)"; exit 1; }
          r=$(grep -c "co-simulated" lockstep.log || true)
          [ "$r" -eq "$((n * 2))" ] || { echo "::error::attiny202-lockstep: $r/$((n * 2)) boot scenarios co-simulated"; exit 1; }

      # Short soak smoke (5 min simulated ~= 2 s/variant) -- proves the soak
      # harness + liveness path work on every variant. Longer soaks remain an
      # optional local development run via XT_SOAK_DURATION_MS; they are not
      # part of release qualification.
      - name: Soak smoke (make attiny202-soak, 5 min simulated)
        run: |
          set -o pipefail
          n=$(make -s print-XT_VARIANTS_SUPPORTED | wc -w)
          make attiny202-soak XT_SOAK_DURATION_MS=300000 \
               XT_SOAK_PROGRESS_INTERVAL_MS=300000 2>&1 | tee soak.log
          p=$(grep -c "SOAK PASS" soak.log || true)
          [ "$p" -eq "$n" ] || { echo "::error::attiny202-soak: $p/$n variants PASSed (skip or fail)"; exit 1; }

      - name: Upload ATtiny202 firmware images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-attiny202
          path: build_avr_xt/*.hex
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Visible build matrix: prove every variant builds for every release-supported
  # AVR Classic MCU and publish the firmware images + size reports. `make
  # attiny13a`/`attiny45`/`attiny85` builds all variants for that part; the
  # matching attiny<n>-size target prints flash/RAM.
  # -------------------------------------------------------------------------
  build-matrix:
    name: build (${{ matrix.mcu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: pic   # gate behind the fast PIC job (see `verify`)
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcu: attiny13a
            build: attiny13a
            size: attiny13a-size
          - mcu: attiny85
            build: attiny85
            size: attiny85-size
          - mcu: attiny45
            build: attiny45
            size: attiny45-size
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make util-linux gcc-avr avr-libc

      - name: Build all variants for ${{ matrix.mcu }}
        run: make ${{ matrix.build }}

      - name: Resource utilization (flash / RAM)
        run: make ${{ matrix.size }} AVR_REBUILD_PREREQ= | tee size-${{ matrix.mcu }}.txt

      - name: Upload firmware images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ matrix.mcu }}
          path: |
            build_avr_classic/*.hex
            size-${{ matrix.mcu }}.txt
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Exhaustive / mutation suite (minutes-long). Kept off every PR: runs on
  # pushes to main, the weekly schedule, and manual dispatch. `make test-long`
  # = the full suite with the exhaustive input domains plus mutation testing
  # (verifies the suite actually kills injected firmware faults).
  # -------------------------------------------------------------------------
  stress:
    name: stress (make test-long)
    runs-on: ubuntu-24.04
    # The job this exists for. In v0.9.8 a severed override left one mutant
    # running a 24 h soak instead of 2 s; with no bound, GitHub cancelled at
    # its 6 h default and reported nothing useful. 300 min is far above any
    # observed run and still fails loudly, with the log, well before that.
    timeout-minutes: 300
    needs: pic   # gate behind the fast PIC job (see `verify`)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make util-linux git gnupg python3 python3-yaml \
            gcc-avr avr-libc \
            simavr libsimavr-dev libelf-dev \
            clang clang-tidy cppcheck cbmc
          command -v git >/dev/null || { echo "::error::git missing"; exit 1; }
          command -v gpg >/dev/null || { echo "::error::gpg missing"; exit 1; }
          python3 -c 'import yaml' \
            || { echo "::error::PyYAML missing"; exit 1; }

      # MUTATION_ALLOW_SKIP=1 is stated explicitly rather than left to the
      # default. This job installs no XC8/gpsim and neither ATtiny202 input, so
      # both chips' PIC mutants AND the ATtiny202 lane are unavailable here and
      # must be allowed to report skipped -- but that makes this job's mutation
      # output for those substrates diagnostic only. The authoritative,
      # fail-closed evidence for all of them comes from the `pic` job, which
      # asserts every toolchain first and runs MUTATION_ALLOW_SKIP=0 (§11).
      # Saying so on the command line means a future change to the default
      # cannot silently turn this into either a false pass or a spurious failure.
      - name: Exhaustive + mutation suite
        run: make test-long MUTATION_ALLOW_SKIP=1
