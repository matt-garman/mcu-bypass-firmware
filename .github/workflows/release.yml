name: Release

# Publishes a firmware release when a vX.Y.Z tag is pushed.
#
# This is the PUBLIC ATTESTATION half of the release pipeline. The local
# scripts/make-release.sh (run by the maintainer before tagging) does the heavy
# validation -- the exhaustive suite plus the 24-hour parallel soaks that cannot
# fit in a hosted runner's time limit -- and commits the prebuilt images under
# release/<tag>/ with a SHA256SUMS manifest.
#
# When the tag lands here, this workflow:
#   1. verifies the checksum signature against the pinned maintainer key, then
#      verifies the retained qualification belongs to the tag event's commit:
#      an artifact-only child whose sole parent is the qualified source;
#   2. rebuilds every release image from the TAGGED source on a clean runner
#      (AVR Classic + ATtiny202 + PIC10F322 + PIC10F320 + PIC12F675), then regenerates
#      and byte-compares one-shot rename/change evidence when the table applies;
#   3. REPRODUCIBILITY GATE: asserts the committed files, SHA256SUMS entries,
#      freshly built files, AND the canonical RELEASE_IMAGES set the Makefile
#      declares are all the same complete set with byte-identical contents
#      (fails the release if not). The fourth set is what makes the other three
#      mean anything: three sets derived by globbing the same directories agree
#      perfectly on a release that is missing an entire MCU (merge plan §10);
#   4. re-runs `make test-long` + `make attiny202-test` +
#      `make attiny202-test-target` + `make pic10f322-test` +
#      `make pic10f322-test-target-variants` + `make pic10f320-test` +
#      `make pic10f320-test-target-variants` + both PIC12F675 aggregates in one
#      Make graph on the clean runner -- the same gates the MANIFEST claims;
#   5. rechecks the protected remote tag and the complete frozen publication
#      inventory, then re-verifies the detached checksum signature and image
#      checksums from the exact directory passed to `gh release create`, which
#      publishes a bare `vX.Y.Z` as an ordinary release and any accepted suffix
#      (`v1.0.0-rc.1`) as a prerelease.
#
# `ubuntu-24.04` is a MOVING hosted-runner label, and the apt tools below install
# without version constraints -- so the runner and the apt toolchain are RECORDED,
# not pinned. What the release actually enforces: (1) every published image is
# reproduced and compared BYTE-FOR-BYTE against the signed SHA256SUMS (the final,
# independent gate); (2) the image-defining compilers are version-pinned and
# preflight-enforced -- XC8 V3.10 + PIC10-12Fxxx_DFP 1.9.189 by digest here, and
# avr-gcc 7.3.0 by scripts/make-release.sh (hard fail on drift); (3) the XC8/DFP
# cache is integrity-verified on every restore (verify_pic_toolchain_cache.sh).
# Analyzer/simulator versions ride the runner and are recorded in the MANIFEST,
# not pinned. See TOOLCHAIN.adoc "What the release enforces".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write          # required to create the GitHub Release

env:
  DEBIAN_FRONTEND: noninteractive
  # Pin to the versions in TOOLCHAIN.adoc; bump compiler + DFP together.
  XC8_VERSION: "3.10"
  DFP_VERSION: "1.9.189"
  # ATtiny202 device pack; keep in step with scripts/fetch_attiny_dfp.sh's pin
  # and with the ci.yml jobs that share this cache key.
  ATTINY_DFP_VER: "3.1.260"
  XC8_DIR: /opt/microchip/xc8/v3.10
  XC8_DFP_ROOT: /opt/microchip/mdfp/PIC10-12Fxxx_DFP/1.9.189

jobs:
  release:
    name: reproduce + publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The qualified source must be the release commit's sole parent.
          fetch-depth: 2
          # This job has contents:write for publication, but no earlier build or
          # verification step should receive a reusable Git credential.
          persist-credentials: false

      - name: Install and assert release verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make git gnupg python3 python3-yaml
          command -v make >/dev/null || { echo "::error::make missing"; exit 1; }
          command -v git >/dev/null || { echo "::error::git missing"; exit 1; }
          command -v gpg >/dev/null || { echo "::error::gpg missing"; exit 1; }
          python3 -c 'import yaml' \
            || { echo "::error::PyYAML missing"; exit 1; }

      - name: Locate the committed release directory
        id: rel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_OBJECT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          source_dir="release/${tag}"
          test -d "$source_dir"        || { echo "::error::no committed $source_dir/ -- run scripts/make-release.sh and commit it before tagging"; exit 1; }
          dir="${RUNNER_TEMP}/committed-release"
          rm -rf "$dir"
          cp -a -- "$source_dir" "$dir"
          test -f "$dir/SHA256SUMS" && test ! -L "$dir/SHA256SUMS" \
            && test -s "$dir/SHA256SUMS" \
            || { echo "::error::$dir/SHA256SUMS is missing, empty, or not a regular file"; exit 1; }
          scripts/verify-release-signature.sh detached \
            "$dir/SHA256SUMS.asc" "$dir/SHA256SUMS"
          test -f "$dir/MANIFEST.md" && test ! -L "$dir/MANIFEST.md" \
            || { echo "::error::$dir/MANIFEST.md is missing or not a regular file"; exit 1; }
          if grep -Fq 'DRY RUN -- NOT A VALIDATED RELEASE' "$dir/MANIFEST.md"; then
            echo "::error::$dir was produced by a dry run and must not be published"
            exit 1
          fi
          grep -Fxq -- '- **Release mode:** production' "$dir/MANIFEST.md" \
            || { echo "::error::$dir/MANIFEST.md does not identify a production release"; exit 1; }
          command -v make >/dev/null || { echo "::error::make is required by qualification verification"; exit 1; }
          scripts/verify-release-qualification.sh "$dir" "$tag"
          scripts/verify-release-history.sh "$dir" "$tag" "$RELEASE_OBJECT"
          release_commit=$(git rev-parse "$RELEASE_OBJECT^{commit}")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      # --- toolchains: AVR + host analyzers (apt) ---------------------------
      - name: Install AVR + analysis toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make util-linux gcc-avr avr-libc binutils-avr \
            simavr libsimavr-dev libelf-dev \
            clang clang-tidy cppcheck cbmc python3 unzip wget

      # --- toolchain: XC8 + PIC10-12Fxxx DFP (Microchip downloads) ----------
      # gpsim CLI drives `make pic10f322-test`; gpsim-dev + libglib2.0-dev + g++ build
      # the libgpsim harnesses behind `make pic10f322-test-target-variants`.
      - name: Install gpsim + libgpsim build deps (apt)
        run: sudo apt-get install -y gpsim gpsim-dev libglib2.0-dev g++ pkg-config

      - name: Restore cached XC8 + DFP
        id: cache-xc8
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/microchip
          key: microchip-xc8-${{ env.XC8_VERSION }}-dfp-${{ env.DFP_VERSION }}-${{ hashFiles('scripts/install_pic_toolchain.sh') }}

      - name: Install XC8 (free tier) + DFP
        if: steps.cache-xc8.outputs.cache-hit != 'true'
        run: scripts/install_pic_toolchain.sh

      # Runs on EVERY path (hit or miss): a restored cache bypasses the
      # SHA-verified installer, so this read-only check rejects a corrupted or
      # incomplete /opt/microchip before any build/test consumes it.
      - name: Verify XC8 + DFP cache integrity
        run: scripts/verify_pic_toolchain_cache.sh

      # --- toolchain: ATtiny_DFP + patched yasimavr (ATtiny202 lane) --------
      # The DFP is needed to BUILD the three ATtiny202 images the reproducibility
      # gate compares; the patched yasimavr venv is needed to RUN the target
      # gates this workflow re-executes. Both are version-pinned, fetched by repo
      # scripts, and cached on the same keys ci.yml uses.
      - name: Install ATtiny202 harness deps (apt)
        run: sudo apt-get install -y python3-venv python3-dev curl patch

      - name: Restore cached ATtiny_DFP
        id: cache-dfp
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/attiny_dfp
          key: attiny-dfp-${{ env.ATTINY_DFP_VER }}-${{ hashFiles('scripts/fetch_attiny_dfp.sh') }}

      - name: Restore cached patched yasimavr venv
        id: cache-yasimavr
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/yasimavr/venv
          key: yasimavr-venv-${{ hashFiles('scripts/fetch_yasimavr.sh', 'scripts/yasimavr-build-requirements.txt', 'third_party/yasimavr/patches/**') }}

      - name: Fetch ATtiny202 device pack + patched simulator
        run: |
          scripts/fetch_attiny_dfp.sh
          scripts/fetch_yasimavr.sh

      - name: Save ATtiny_DFP cache
        if: steps.cache-dfp.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/attiny_dfp
          key: attiny-dfp-${{ env.ATTINY_DFP_VER }}-${{ hashFiles('scripts/fetch_attiny_dfp.sh') }}

      - name: Save yasimavr venv cache
        if: steps.cache-yasimavr.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/yasimavr/venv
          key: yasimavr-venv-${{ hashFiles('scripts/fetch_yasimavr.sh', 'scripts/yasimavr-build-requirements.txt', 'third_party/yasimavr/patches/**') }}

      - name: Assert ATtiny202 toolchain present (fail loud, do NOT skip)
        run: |
          test -f third_party/attiny_dfp/gcc/dev/attiny202/device-specs/specs-attiny202 \
            || { echo "::error::ATtiny202 device specs missing"; exit 1; }
          py=third_party/yasimavr/venv/bin/python
          test -x "$py" || { echo "::error::yasimavr venv missing ($py)"; exit 1; }
          "$py" -c "import yasimavr" || { echo "::error::yasimavr import broken"; exit 1; }
          command -v avr-nm >/dev/null || { echo "::error::avr-nm missing"; exit 1; }
          command -v avr-objdump >/dev/null || { echo "::error::avr-objdump missing"; exit 1; }

      - name: Assert PIC toolchain present (fail loud, do NOT skip)
        run: |
          test -x "${XC8_DIR}/bin/xc8-cc" || { echo "::error::XC8 missing"; exit 1; }
          # All three device headers. One DFP ships every part, but a truncated
          # unpack would leave one chip's lane skipping silently -- and this is
          # the public attestation, where a skipped lane must never read green.
          for d in pic10f322 pic10f320 pic12f675; do
            dev="${XC8_DFP_ROOT}/xc8/pic/include/proc/${d}.h"
            test -f "$dev" || { echo "::error::DFP missing: $dev"; exit 1; }
          done
          command -v gpsim >/dev/null || { echo "::error::gpsim missing"; exit 1; }
          command -v c++ >/dev/null || { echo "::error::c++ missing"; exit 1; }
          test -f /usr/include/gpsim/sim_context.h || { echo "::error::gpsim-dev headers missing"; exit 1; }
          pkg-config --exists glib-2.0 || { echo "::error::libglib2.0-dev missing"; exit 1; }

      - name: Save XC8 + DFP cache
        if: steps.cache-xc8.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/microchip
          key: microchip-xc8-${{ env.XC8_VERSION }}-dfp-${{ env.DFP_VERSION }}-${{ hashFiles('scripts/install_pic_toolchain.sh') }}

      - name: Record toolchain versions
        run: |
          echo "== avr-gcc ==" && avr-gcc --version | head -1
          echo "== binutils-avr ==" && avr-objcopy --version | head -1
          echo "== xc8-cc ==" && "${XC8_DIR}/bin/xc8-cc" --version | head -2 || true
          echo "== cppcheck ==" && cppcheck --version
          echo "== cbmc ==" && cbmc --version

      # --- rebuild from the tag --------------------------------------------
      - name: Rebuild all release images from the tagged source
        run: |
          make clean
          make attiny13a attiny85 attiny45
          # STRICT_TOOLS=1: an absent ATtiny_DFP must fail the reproducibility
          # gate, never skip it into an image set that is short three files.
          make attiny202 STRICT_TOOLS=1 XT_STATIC_RAM_LIMIT=16
          make pic10f322 PIC_CC="${XC8_DIR}/bin/xc8-cc" PIC_DFP="${XC8_DFP_ROOT}/xc8"
          # pic10f320-variants, not pic10f320: it builds all three output stages and
          # removes the whole image set if any one of them fails, so a partial
          # matrix can never reach the reproducibility gate.
          make pic10f320-variants PIC10F320_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC10F320_DFP="${XC8_DFP_ROOT}/xc8"
          # PIC12F675 shares PIC_CC/PIC_DFP with the 322. Its three shipped HEXes
          # are in RELEASE_IMAGES, so they must be rebuilt here or the
          # reproducibility gate below fails on a set short three files.
          make pic12f675 PIC_CC="${XC8_DIR}/bin/xc8-cc" PIC_DFP="${XC8_DFP_ROOT}/xc8" \
            PIC12F675_DATA_LIMIT=48

      # --- THE reproducibility gate ----------------------------------------
      - name: Verify committed images and rename/change evidence reproduce bit-for-bit
        id: repro
        env:
          RELEASE_DIR: ${{ steps.rel.outputs.dir }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir=$RELEASE_DIR

          # Give rename/change evidence and normal reproduction the same immutable
          # view of the clean build. Reading the live paths in sequence would
          # allow a change between gates to make both individually pass over
          # different bytes.
          image_dirs_text=$(make -s print-RELEASE_IMAGE_DIRS)
          read -r -a image_dirs <<< "$image_dirs_text"
          ((${#image_dirs[@]} > 0)) \
            || { echo "::error::Makefile RELEASE_IMAGE_DIRS is empty"; exit 1; }
          fresh_root="${RUNNER_TEMP}/fresh-release-images"
          publish_stage="${RUNNER_TEMP}/verified-release-stage"
          frozen_root=/opt/mcu-bypass-publication
          publish="$frozen_root/bundle"
          rename_status="${RUNNER_TEMP}/rename-identity.status"
          inventory="$frozen_root/inventory.json"
          rm -rf "$fresh_root" "$publish_stage" "$rename_status"
          sudo rm -rf -- "$frozen_root"
          mkdir -p "$fresh_root" "$publish_stage"
          fresh_dirs=()
          images=()
          shopt -s nullglob dotglob
          for i in "${!image_dirs[@]}"; do
            fresh_dir="$fresh_root/$i"
            mkdir "$fresh_dir"
            cp -a -- "${image_dirs[$i]}"/. "$fresh_dir"/
            fresh_dirs+=("$fresh_dir")
            for image in "$fresh_dir"/*.hex; do
              images+=("$image")
            done
          done
          ((${#images[@]} > 0)) \
            || { echo "::error::clean rebuild produced no release images"; exit 1; }
          scripts/verify-rename-identity.sh --compare-report "$dir" \
            "$publish_stage/RENAME_IDENTITY.md" "$RELEASE_TAG" "${images[@]}" \
            > "$rename_status"
          mapfile -t rename_fields < "$rename_status"
          [ "${#rename_fields[@]}" -eq 2 ] \
            || { echo "::error::rename verifier returned malformed status"; exit 1; }
          case "${rename_fields[0]}" in
          rename_identity_applicable=1)
            rename_applicable=1
            [[ "${rename_fields[1]}" =~ ^rename_identity_sha256=([0-9a-f]{64})$ ]] \
              || { echo "::error::rename verifier returned malformed applicable digest"; exit 1; }
            rename_sha256=${BASH_REMATCH[1]}
            ;;
          rename_identity_applicable=0)
            rename_applicable=0
            [ "${rename_fields[1]}" = rename_identity_sha256= ] \
              || { echo "::error::inapplicable rename status carried a digest"; exit 1; }
            rename_sha256=
            ;;
          *)
            echo "::error::rename verifier returned invalid applicability"
            exit 1
            ;;
          esac

          frozen_rename="$publish_stage/RENAME_IDENTITY.md"
          if [ "$rename_applicable" -eq 1 ]; then
            test -f "$frozen_rename" && test ! -L "$frozen_rename" \
              && test -s "$frozen_rename" \
              || { echo "::error::verified rename report was not retained as a regular file"; exit 1; }
            frozen_rename_sha256=$(sha256sum -- "$frozen_rename")
            frozen_rename_sha256=${frozen_rename_sha256%% *}
            [ "$frozen_rename_sha256" = "$rename_sha256" ] \
              || { echo "::error::frozen rename report differs from verified bytes"; exit 1; }
          elif [ -e "$frozen_rename" ] || [ -L "$frozen_rename" ]; then
            echo "::error::inapplicable rename check retained an unexpected report"
            exit 1
          fi

          # Enforce FOUR-way equality for release images: the canonical
          # RELEASE_IMAGES set, the actual committed .hex files, the checksum
          # entries, and the fresh build output. Hash-only verification misses
          # unlisted files that the publication glob would otherwise upload, and
          # three-way equality between observations misses anything all three
          # observations omit together.
          #
          # The snapshot directories correspond one-for-one with the Makefile's
          # list, so adding a target cannot leave this call on a stale set.
          scripts/verify-release-images.sh "$dir" "${fresh_dirs[@]}"

          release_images_text=$(make -s --no-print-directory print-RELEASE_IMAGES)
          read -r -a expected_assets <<< "$release_images_text"
          ((${#expected_assets[@]} > 0)) \
            || { echo "::error::Makefile RELEASE_IMAGES is empty"; exit 1; }
          # Required non-image artifacts (the PIC12F675 flashing helper). Read
          # from the same Makefile as the images, declared separately so a tool
          # cannot move the reviewed image count, and published as assets so a
          # downloader gets the helper alongside the HEX it is required to use.
          release_helper_text=$(make -s --no-print-directory print-RELEASE_HELPER_MAP)
          read -r -a release_helper_entries <<< "$release_helper_text"
          ((${#release_helper_entries[@]} > 0)) \
            || { echo "::error::Makefile RELEASE_HELPER_MAP is empty"; exit 1; }
          release_helper_names=()
          for entry in "${release_helper_entries[@]}"; do
            helper_base=${entry%%=*}
            [ -n "$helper_base" ] && [ "$helper_base" != "$entry" ] \
              || { echo "::error::malformed RELEASE_HELPER_MAP entry: $entry"; exit 1; }
            release_helper_names+=("$helper_base")
            cp -p -- "$dir/$helper_base" "$publish_stage"/ \
              || { echo "::error::required release artifact is missing: $helper_base"; exit 1; }
          done
          expected_assets+=("${release_helper_names[@]}")
          expected_assets+=(SHA256SUMS SHA256SUMS.asc MANIFEST.md QUALIFICATION)
          if [ "$rename_applicable" -eq 1 ]; then
            expected_assets+=(RENAME_IDENTITY.md)
          fi

          # Freeze the verified release assets before later test targets run.
          # Publication consumes only this snapshot, never the mutable tree.
          test -f "$dir/MANIFEST.md" && test ! -L "$dir/MANIFEST.md" \
            || { echo "::error::$dir/MANIFEST.md is missing or not a regular file"; exit 1; }
          cp -p -- "$dir"/*.hex "$dir/SHA256SUMS" "$dir/SHA256SUMS.asc" \
            "$dir/MANIFEST.md" "$dir/QUALIFICATION" "$publish_stage"/
          sudo install -d -o root -g root -m 0700 -- "$frozen_root" "$publish"
          for asset in "${expected_assets[@]}"; do
            sudo install -o root -g root -m 0444 -- \
              "$publish_stage/$asset" "$publish/$asset"
          done
          inventory_sha256=$(sudo python3 scripts/verify_release_publication.py \
            record "$publish" "$inventory" "${expected_assets[@]}")
          [[ "$inventory_sha256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::publication inventory returned an invalid digest"; exit 1; }
          sudo chmod 0444 -- "$inventory"
          sudo chmod 0555 -- "$publish" "$frozen_root"
          python3 scripts/verify_release_publication.py verify \
            "$publish" "$inventory" "$inventory_sha256"
          {
            echo "dir=$publish"
            echo "inventory=$inventory"
            echo "inventory_sha256=$inventory_sha256"
            echo "helper_assets=${release_helper_names[*]}"
            echo "rename_identity_applicable=$rename_applicable"
            echo "rename_identity_sha256=$rename_sha256"
          } >> "$GITHUB_OUTPUT"

      # --- re-run the gates on the clean runner -----------------------------
      # STRICT_TOOLS=1 throughout: this is THE public attestation, so every gate
      # must actually run -- a silently-skipped tool must fail the release.
      - name: Re-run make test-long
        run: make test-long STRICT_TOOLS=1 XT_STATIC_RAM_LIMIT=16 \
          XT_STACK_MAX_FRAME=32 PIC12F675_DATA_LIMIT=48

      - name: Re-run make attiny202-test
        run: make attiny202-test STRICT_TOOLS=1 XT_STATIC_RAM_LIMIT=16 XT_STACK_MAX_FRAME=32

      # The AVR-XT target aggregate: functional + modeled-pin output trace, fault
      # injection, and firmware/model ctx_ lock-step on the real built image.
      - name: Re-run make attiny202-test-target (yasimavr, every variant)
        run: make attiny202-test-target STRICT_TOOLS=1 XT_STATIC_RAM_LIMIT=16 XT_STACK_MAX_FRAME=32

      - name: Re-run make pic10f322-test
        run: make pic10f322-test STRICT_TOOLS=1 PIC_CC="${XC8_DIR}/bin/xc8-cc" PIC_DFP="${XC8_DFP_ROOT}/xc8"

      # The MANIFEST's Validation line claims the fail-closed PIC target aggregate;
      # the public clean-runner attestation must actually re-run it rather than
      # lean on committed local evidence. The aggregate fails on any silent skip.
      - name: Re-run make pic10f322-test-target-variants (libgpsim, every variant)
        run: |
          make pic10f322-test-target-variants STRICT_TOOLS=1 \
            PIC_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC_DFP="${XC8_DFP_ROOT}/xc8"

      # The PIC10F320 half of the same claim. Its images are in the release set,
      # so its gates belong in the public attestation on identical terms -- and
      # the constrained target is the one whose evidence a reader is most likely
      # to want to see re-run on a clean machine.
      - name: Re-run make pic10f320-test
        run: |
          make pic10f320-test STRICT_TOOLS=1 \
            PIC10F320_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC10F320_DFP="${XC8_DFP_ROOT}/xc8"

      - name: Re-run make pic10f320-test-target-variants (libgpsim, every variant)
        run: |
          make pic10f320-test-target-variants STRICT_TOOLS=1 \
            PIC10F320_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC10F320_DFP="${XC8_DFP_ROOT}/xc8"

      # The PIC12F675, on identical terms: release-supported since v0.9.9, images
      # in the release set, so both its aggregates belong in the public
      # attestation. They must share one Make graph and therefore one retained
      # shipping/simulator/sidecar matrix; pic12f675-test also carries the
      # calibration contract that binds simcal to the shipped HEX.
      - name: Re-run PIC12F675 qualification (one retained matrix)
        run: |
          make pic12f675-test pic12f675-test-target-variants STRICT_TOOLS=1 \
            PIC_CC="${XC8_DIR}/bin/xc8-cc" \
            PIC_DFP="${XC8_DFP_ROOT}/xc8" PIC12F675_DATA_LIMIT=48

      # --- publish ----------------------------------------------------------
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.repro.outputs.dir }}
          RELEASE_INVENTORY: ${{ steps.repro.outputs.inventory }}
          RELEASE_INVENTORY_SHA256: ${{ steps.repro.outputs.inventory_sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIED_RELEASE_COMMIT: ${{ steps.rel.outputs.commit }}
          RENAME_IDENTITY_APPLICABLE: ${{ steps.repro.outputs.rename_identity_applicable }}
          RENAME_IDENTITY_SHA256: ${{ steps.repro.outputs.rename_identity_sha256 }}
          RELEASE_HELPER_ASSETS: ${{ steps.repro.outputs.helper_assets }}
        run: |
          set -euo pipefail
          dir=$RELEASE_DIR
          tag=$RELEASE_TAG
          # The required non-image artifacts, carried forward from the step that
          # verified and froze them rather than re-derived here. Re-reading the
          # Makefile at publication time would let a mutable working tree decide
          # what a frozen, already-verified bundle publishes.
          read -r -a helper_names <<< "${RELEASE_HELPER_ASSETS:-}"
          ((${#helper_names[@]} > 0)) \
            || { echo "::error::no required release artifacts were carried forward"; exit 1; }
          helper_assets=()
          for helper_base in "${helper_names[@]}"; do
            case "$helper_base" in
              */*|.*|"") echo "::error::invalid required release artifact: $helper_base"; exit 1 ;;
            esac
            test -f "$dir/$helper_base" && test ! -L "$dir/$helper_base" \
              || { echo "::error::frozen bundle is missing required artifact: $helper_base"; exit 1; }
            helper_assets+=( "$dir/$helper_base" )
          done
          assets=( "$dir"/*.hex "${helper_assets[@]}" \
            "$dir/SHA256SUMS" "$dir/SHA256SUMS.asc" \
            "$dir/MANIFEST.md" "$dir/QUALIFICATION" )
          notes="$dir/MANIFEST.md"; [ -f "$notes" ] || notes=/dev/null
          # Publication kind, decided from the tag alone. A bare vX.Y.Z is an
          # ordinary release; every accepted suffix (v1.0.0-rc.1) publishes as a
          # GitHub PRERELEASE, so a candidate can never take latest-release
          # selection away from the newest stable version. The two branches below
          # partition exactly the version grammar scripts/make-release.sh and
          # scripts/verify-release-qualification.sh enforce -- the latter already
          # rejected a malformed tag in the locate step, before any build -- so an
          # unrecognized shape reaching here means that gate was bypassed: fail
          # closed rather than defaulting to either kind.
          prerelease_flag=()
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            :
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*$ ]]; then
            prerelease_flag=( --prerelease )
          else
            echo "::error::tag '$tag' is not vX.Y.Z (optionally -suffix)"
            exit 1
          fi
          scripts/verify-release-tag-target.sh origin "$tag" "$VERIFIED_RELEASE_COMMIT"
          rename_report="$dir/RENAME_IDENTITY.md"
          case "$RENAME_IDENTITY_APPLICABLE" in
          1)
            [[ "$RENAME_IDENTITY_SHA256" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::applicable rename report has an invalid expected digest"; exit 1; }
            test -f "$rename_report" && test ! -L "$rename_report" \
              && test -s "$rename_report" \
              || { echo "::error::frozen rename report is missing, empty, or not a regular file"; exit 1; }
            actual_rename_sha256=$(sha256sum -- "$rename_report")
            actual_rename_sha256=${actual_rename_sha256%% *}
            [ "$actual_rename_sha256" = "$RENAME_IDENTITY_SHA256" ] \
              || { echo "::error::frozen rename report changed after verification"; exit 1; }
            assets+=("$rename_report")
            ;;
          0)
            [ -z "$RENAME_IDENTITY_SHA256" ] \
              || { echo "::error::inapplicable rename report has an unexpected digest"; exit 1; }
            if [ -e "$rename_report" ] || [ -L "$rename_report" ]; then
              echo "::error::inapplicable release contains a frozen rename report"
              exit 1
            fi
            ;;
          *)
            echo "::error::invalid frozen rename applicability state"
            exit 1
            ;;
          esac
          python3 scripts/verify_release_publication.py verify \
            "$dir" "$RELEASE_INVENTORY" "$RELEASE_INVENTORY_SHA256"
          scripts/verify-release-signature.sh detached \
            "$dir/SHA256SUMS.asc" "$dir/SHA256SUMS"
          # The checksum tool is third-party, so its failure text is not ours to
          # rely on: coreutils 9.x dropped the "SHA256" token from this very
          # message. Emit our own annotation so a strict-verification failure
          # surfaces as a GitHub error and is assertable by project-owned text.
          (cd "$dir" && sha256sum --check --strict -- SHA256SUMS) \
            || { echo "::error::strict image checksum verification failed"; exit 1; }
          python3 scripts/verify_release_publication.py verify \
            "$dir" "$RELEASE_INVENTORY" "$RELEASE_INVENTORY_SHA256"
          gh release create "$tag" \
            --title "Firmware $tag" \
            --notes-file "$notes" \
            --verify-tag \
            "${prerelease_flag[@]}" \
            "${assets[@]}"
